name: grok_zoro
description: Zoro, a clean GTD productivity app built with Flutter.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  cupertino_icons: ^1.0.8
  fpdart: ^1.1.1
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  http: ^1.2.2
  intl: ^0.19.0
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.5
  speech_to_text: ^6.6.0
  uuid: ^4.5.1
  file_picker: ^11.0.2
  excel: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  flutter_lints: ^5.0.0
  isar_generator: ^3.1.0+1

flutter:
  uses-material-design: true
